<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
    <style>
        *{
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }
        .container{
            align-items: center;
            justify-content: space-around;
            height: 600px;
            min-height: 100vh;
            /* padding: 20px; */
            gap: 20px;
            /*border: 1px solid black;*/
            display: flex;
            flex-wrap: wrap;
        }
        .box{
            height: 80%;
            width: 80%;
            /*border: 1px solid black;*/
            display: flex;
            box-shadow: ;
            margin: auto;
            margin-top: 60px;
        }
        .left,.center,.right{
            height: 100%;
            /*border: 1px solid black;*/
        }
        .left{
            width: 2%;
            background-color: navy;
            border-radius: 20px;
        }
        .center{
            width: 63%;
            font-size: 60px;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            color: navy;
            background-color: whitesmoke;
        }
        .center>h1{
            margin-left: 20px;
        }
        h1{
            margin-left: 20px;
            /* font-size: 100px; */
            margin: 0;
            line-height: 1.2;
        }
        .right{ 
            /*border-left: 1px solid grey;*/   
            width: 100%;
            max-width: 320px;
            box-shadow: 10px 10px 10px;
            border-radius: 20px;
        }
        .top{
            height: 30%;
            /*border: 1px solid black;*/
        }
        .top-in{
            height: 90%;
            /*border: 1px solid black;*/
            background-color: navy;
            border-top-left-radius: 20px;
            border-top-right-radius: 20px;
        }
        .bottom{
            height: 70%;
            /*border: 1px solid black;*/
        }
        .circle{
            position: absolute;
            top: 80px;
            right: 295px;
            height: 125px;
            width: 125px;
            border: 5px solid navy;
            border-radius: 50%;
            display: flex;
            align-items: center;
            justify-content: center;
        }
        img{
            height: 100%;
            width: 100%;
            border-radius: 50%;
            border: 2px solid white;
        }
        .bottom>h1,.icon,.button{
            margin-bottom: 10px;
            text-align: center;
            font-size: 20px;
        }
        .icon{
            height: 20%;
            display: flex;
            justify-content: space-evenly;
            gap: 10px;
        }
        .button{
            height: 20%;
            /*border: 1px solid black;*/
            display: flex;
            color: white;
            justify-content: space-evenly;
            /* align-items: center; */
        }
        .b1,.b2{
            height: 50%;
            width: 40%;
            /* border: 1px solid black; */
            background-color: navy;
            border-radius: 20px;
            color: aliceblue;
            text-align: center;
            line-height: 30px;
        }
        .fa-facebook{
            color: blue;
        }
        .fa-github{
            color: violet;
        }
        .fa-linkedin{
            color: skyblue;
        }
        .fa-behance{
            color: black;
        }
        .fa-instagram{
            background: linear-gradient(red,orange,violet);
            color: transparent;
            background-clip: text;
        }   
    </style>
</head>
<body>
    <div class="container">
        <div class="box">
            <div class="left"></div>
            <div class="center">
                <h1>Profile Card UI UX Design</h1>
            </div>
            <div class="right">
                <div class="top">
                    <div class="top-in">
                        <div class="circle">
                            <img src="img1.png" alt="">
                        </div>
                    </div>
                </div>
                <div class="bottom">
                    <h1>Website Developer</h1>
                    <h1>Dezyne École College</h1>
                    <h1>BCA 1st Year</h1>
                    <div class="icon">
                        <i class = "fa fa-brands fa-2x fa-facebook"></i>
                        <i class = "fa fa-brands fa-2x fa-github"></i>
                        <i class = "fa fa-brands fa-2x fa-linkedin"></i>
                        <i class = "fa fa-brands fa-2x fa-behance"></i>
                        <i class = "fa fa-brands fa-2x fa-instagram"></i>
                    </div>
                    <div class="button">
                        <div class="b1">Subscribe</div>
                        <div class="b2">Message</div>
                    </div>   
                    <div class="icon">
                    <i class = "fa fa-solid fa-heart"></i>60.4k
                    <i class = "fa fa-solid fa-comment"></i>20k
                    <i class = "fa fa-solid fa-share fa-flip-horizontal"></i>12.6k
                </div> 
            </div>
            </div>
        </div>
    </div>
</body>
</html>
